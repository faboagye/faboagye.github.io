project:
  type: website
  output-dir: docs
  post-render: _fix_sitemap.py
  render:
    - "*.qmd"
    - "!posts/"
  resources:
    - "files/Fuseini_Aboagye_CV.pdf"
    - "files/Alzheimers_Research.pdf"

description-meta: "Website for Fuseini Aboagye"
author-meta: "Fuseini Aboagye"

website:
  favicon: "files/images/favicon.png"
  image: "files/images/Fprofile.png"
  description: "Teaching and Research Assistant, Department of Statistics and Actuarial Science, University of Ghana"
  site-url: "https://faboagye.github.io"
  repo-url: "https://github.com/faboagye/faboagye.github.io"
  open-graph: true
  twitter-card: true
  search: false
  page-navigation: false
  reader-mode: false
  draft-mode: unlinked

format:
  html:
    theme: none
    css: site.css
    page-layout: custom
    canonical-url: true
    toc: false
    smooth-scroll: false
    anchor-sections: false
    code-copy: false
    include-in-header:
      - text: |
          <meta property="og:site_name" content="Fuseini Aboagye">
          <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebSite", "name": "Fuseini Aboagye", "url": "https://faboagye.github.io/"}</script>
          <script>document.documentElement.classList.add("js"); try { if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}</script>
          <style>
            html .theme-toggle { display: none; }
            html.js .theme-toggle { display: inline-flex; position: fixed; z-index: 30; top: 19px; right: 16px; }
            @media (max-width: 820px) { html.js .theme-toggle { top: 14px; right: 12px; } }
            @media print { html.js .theme-toggle { display: none; } }
          </style>
          <meta name="google-site-verification" content="3pHmQ-h0wrS_CISpd5JMjWPlBDS9A-Jz_6_On2oYM0Y">
          <link rel="icon" type="image/svg+xml" href="/files/images/favicon.svg">
          <link rel="apple-touch-icon" href="/files/images/apple-touch-icon.png">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Josefin+Sans:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
      - "Views.html"
    include-before-body: "files/includes/header.html"
    include-after-body: "files/includes/footer.html"
